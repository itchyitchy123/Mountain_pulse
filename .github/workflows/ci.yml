name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run checks and tests
        run: npm run ci
      - name: Build production container
        run: docker build --tag mountainpulse:ci .
      - name: Smoke-test production container
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:4173:4173 mountainpulse:ci)
          trap 'docker rm --force "$container_id"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/readyz
