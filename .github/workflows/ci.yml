name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Run checks and tests
        run: npm run ci
      - name: Build production container
        run: docker build --tag mountainpulse:ci .
      - name: Smoke-test production container
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:4173:4173 mountainpulse:ci)
          trap 'docker rm --force "$container_id"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/readyz
