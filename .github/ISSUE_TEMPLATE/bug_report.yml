name: Bug report
description: Report a reproducible problem in MountainPulse.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, precise user locations, production data, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: cbf0a5b
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - Demo
        - Production
        - Unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs, browser, operating system, and relevant source freshness.
