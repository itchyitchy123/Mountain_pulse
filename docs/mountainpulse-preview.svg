<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MountainPulse product preview</title>
  <desc id="desc">A dark green ski intelligence dashboard preview with a simulated scenario badge, mountain pulse score, route recommendation, terrain heat map, and source confidence panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102923"/><stop offset="1" stop-color="#071613"/></linearGradient>
    <linearGradient id="hero" x1="0" x2="1"><stop stop-color="#173c32"/><stop offset="1" stop-color="#24614f"/></linearGradient>
    <linearGradient id="snow" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf5ef"/><stop offset="1" stop-color="#d8e9df"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04100d" flood-opacity=".22"/></filter>
    <clipPath id="mapClip"><rect x="62" y="480" width="844" height="340" rx="20"/></clipPath>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="32" y="28" width="1376" height="844" rx="28" fill="#f4f8f4"/>
  <rect x="32" y="28" width="1376" height="64" rx="28" fill="#0b1e19"/>
  <path d="M67 66l13-22 13 22-13-7z" fill="#56c6a1"/><text x="106" y="67" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Mountain<tspan fill="#56c6a1">Pulse</tspan></text>
  <text x="610" y="67" fill="#d7e4de" font-family="Arial,sans-serif" font-size="14">LIVE MOUNTAIN</text><text x="760" y="67" fill="#9eb7ad" font-family="Arial,sans-serif" font-size="14">POWDER RADAR</text><text x="900" y="67" fill="#9eb7ad" font-family="Arial,sans-serif" font-size="14">PARKING</text><text x="1015" y="67" fill="#9eb7ad" font-family="Arial,sans-serif" font-size="14">TRIP OUTLOOK</text>
  <text x="72" y="140" fill="#17362d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Copper Mountain</text><text x="72" y="165" fill="#6d7e77" font-family="Arial,sans-serif" font-size="13">●  Interactive winter demo   •   Scenario loaded now</text>
  <rect x="62" y="188" width="1316" height="118" rx="18" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="92" y="223" fill="#a8d4c1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">MOUNTAIN PULSE</text><text x="92" y="276" fill="#fff" font-family="Arial,sans-serif" font-size="57" font-weight="800">83</text><text x="194" y="264" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Excellent right now</text>
  <text x="705" y="228" fill="#cde8da" font-family="Arial,sans-serif" font-size="12">SNOW</text><text x="705" y="261" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">96</text><text x="805" y="228" fill="#cde8da" font-family="Arial,sans-serif" font-size="12">CROWDS</text><text x="805" y="261" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">88</text><text x="930" y="228" fill="#cde8da" font-family="Arial,sans-serif" font-size="12">LIFT LINES</text><text x="930" y="261" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">79</text><rect x="1165" y="214" width="172" height="40" rx="20" fill="#d9f4e8"/><text x="1251" y="239" text-anchor="middle" fill="#12634b" font-family="Arial,sans-serif" font-size="12" font-weight="700">SIMULATED DEMO</text>
  <rect x="62" y="328" width="844" height="120" rx="18" fill="#fff" filter="url(#shadow)"/><text x="88" y="360" fill="#d35f38" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">🔥 BEST MOVE RIGHT NOW</text><text x="88" y="398" fill="#17362d" font-family="Arial,sans-serif" font-size="23" font-weight="700">Super Bee → Excelerator → Resolution</text><text x="88" y="426" fill="#6b7d75" font-family="Arial,sans-serif" font-size="13">Fast lifts, cold north-facing snow, and traffic is moving away from the east side.</text><rect x="732" y="379" width="145" height="43" rx="22" fill="#12634b"/><text x="804" y="406" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Start lap  →</text>
