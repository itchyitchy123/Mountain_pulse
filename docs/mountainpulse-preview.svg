  <rect x="62" y="480" width="844" height="340" rx="20" fill="url(#snow)"/><g clip-path="url(#mapClip)" fill="none" stroke="#a3c2b2" stroke-width="2" opacity=".55"><path d="M-40 730C220 500 430 850 970 522"/><path d="M-20 790C320 550 470 860 950 570"/><path d="M70 575C290 740 520 430 900 700"/><path d="M210 480C380 650 670 505 920 790"/></g><path d="M482 505c-100 90-110 210-218 295M518 505c100 90 100 190 230 294M500 520c-15 80 55 160 0 279" fill="none" stroke="#fff" stroke-width="7" opacity=".85"/><text x="94" y="518" fill="#537066" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">MOUNTAIN HEAT MAP</text><text x="95" y="552" fill="#537066" font-family="Arial,sans-serif" font-size="12">RESOLUTION BOWL</text><text x="670" y="552" fill="#537066" font-family="Arial,sans-serif" font-size="12">EAST VILLAGE</text>
  <g font-family="Arial,sans-serif" font-size="11" font-weight="700"><circle cx="395" cy="610" r="28" fill="#ee8058" opacity=".9"/><text x="395" y="614" text-anchor="middle" fill="#fff">94</text><text x="395" y="650" text-anchor="middle" fill="#3d5e52">COPPER BOWL</text><circle cx="295" cy="700" r="24" fill="#f1a25a"/><text x="295" y="704" text-anchor="middle" fill="#fff">91</text><circle cx="600" cy="670" r="23" fill="#64b98d"/><text x="600" y="674" text-anchor="middle" fill="#fff">82</text><circle cx="770" cy="735" r="22" fill="#a7c49e"/><text x="770" y="739" text-anchor="middle" fill="#fff">54</text></g>
  <rect x="62" y="840" width="1316" height="14" rx="7" fill="#d2e5da"/><text x="72" y="866" fill="#799088" font-family="Arial,sans-serif" font-size="11">MountainPulse is a prototype. Simulated data is clearly labeled and is not official resort, patrol, avalanche, or emergency information.</text>
</svg>
